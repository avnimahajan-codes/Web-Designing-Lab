<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Bill Table</title>
</head>
<body>
<h1 align="center" style="color: blue;">Shopping Bill</h1>
<hr>
<table align="center" border="1" cellspacing="0" cellpadding="10">
    <tr style="background-color:aqua;">
    <th>Item</th>
    <th>Quantity</th>
    <th>Price(Rs)</th>
    <th>Amount(Rs)</th>
    </tr>
    <tr>
        <th>Notebook</th>
        <td>2</td>
        <td>50</td>
        <td>100</td>
    </tr>
    <tr>
        <th>Pen</th>
        <td>5</td>
        <td>10</td>
        <td>50</td>
    </tr>
    <tr>
        <th>Book</th>
        <td>1</td>
        <td>200</td>
        <td>200</td>
</tr>
<tr>
    <th>Bag</th>
    <td>1</td>
    <td>500</td>
    <td>500</td>
</tr>
<tr>
    <td colspan="3" style="background-color: aqua;">Total</td>
    <td style="background-color: aqua;">850</td>

</tr>
</table>
    
</body>
</html>
